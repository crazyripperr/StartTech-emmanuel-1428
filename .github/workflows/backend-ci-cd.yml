name: 🔧 Backend CI/CD

on:
  push:
    branches: [main, feature/full-stack]
    paths:
      - 'Server/**'
  pull_request:
    branches: [main, feature/full-stack]
    paths:
      - 'Server/**'

env:
  AWS_REGION: "us-east-1"
  GO_VERSION: "1.21"
  IMAGE_NAME: "starttech-backend"

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Server/go.sum

      - name: 📦 Download dependencies
        run: go mod download

      - name: 🔍 Vet (static analysis)
        run: go vet ./...

      - name: 🧪 Run unit tests
        run: go test ./... -v -race -coverprofile=coverage.out
        env:
          MONGO_URI: "mongodb://localhost:27017/testdb"
          REDIS_ADDR: "localhost:6379"
          PORT: "8080"

      - name: 📊 Show coverage
        run: go tool cover -func=coverage.out

  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/full-stack') && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          file: ./Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 🔒 Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'

  deploy:
    name: 🚀 Deploy to EC2 (Rolling Update)
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/full-stack') && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Get EC2 instance IPs
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "starttech-asg" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          PUBLIC_IPS=""
          for id in $INSTANCE_IDS; do
            IP=$(aws ec2 describe-instances \
              --instance-ids $id \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text)
            PUBLIC_IPS="$PUBLIC_IPS $IP"
          done
          echo "PUBLIC_IPS=$PUBLIC_IPS" >> $GITHUB_ENV

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/starttech.pem
          chmod 600 ~/.ssh/starttech.pem

      - name: 🔄 Rolling deploy to all instances
        run: |
          for IP in $PUBLIC_IPS; do
            echo "Deploying to $IP..."
            ssh -o StrictHostKeyChecking=no \
                -i ~/.ssh/starttech.pem \
                ubuntu@$IP \
                "sudo systemctl restart starttech-backend && \
                 sleep 10 && \
                 sudo systemctl is-active starttech-backend"
            echo "✅ $IP updated"
          done

      - name: 🏥 Smoke test
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.ALB_DNS_NAME }}/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Smoke test passed!"
          else
            echo "❌ Smoke test FAILED! Got: $HTTP_STATUS"
            exit 1
          fi
