name: Backend CI/CD

on:
  push:
    branches: [main, feature/full-stack]
    paths:
      - 'Server/**'
  pull_request:
    branches: [main, feature/full-stack]
    paths:
      - 'Server/**'

env:
  AWS_REGION: "us-east-1"
  IMAGE_NAME: "starttech-backend"

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/MuchToDo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet static analysis
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -v -coverprofile=coverage.out
        continue-on-error: true

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Server/MuchToDo
          file: ./Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get running instance IDs
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "starttech-asg" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          echo "INSTANCE_IDS=$INSTANCE_IDS" >> $GITHUB_ENV
          echo "Found instances: $INSTANCE_IDS"

      - name: Deploy via SSM
        run: |
          for ID in $INSTANCE_IDS; do
            echo "Deploying to $ID via SSM..."
            aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands=["sudo systemctl restart starttech-backend"] \
              --region ${{ env.AWS_REGION }} \
              --output text
            echo "Done: $ID"
          done

      - name: Smoke test via ALB
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.ALB_DNS_NAME }}/health)
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Smoke test passed!"
          else
            echo "App may still be starting - status: $HTTP_STATUS"
          fi
